    <h1><img src="Profile_ava.png" alt="Avatar" width="50"> My Profile</h1>

    <img src="Profilepic.jpg" alt="Profile Picture" width="200"><br><br>

    <div class="button-group">
    <button>Change Profile Picture </button>
    <button>Save</button>
    </div> <br>

    <form>
        <label for="username">User Name *</label><br>
        <input type="text" id="username" name="username" placeholder="Enter your user name" required><br><br>

        <label for="email">Email *</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="age">Age *</label><br>
        <input type="number" id="age" name="age" min="18" max="100" placeholder="Enter your age" required><br><br>

<div class="button-group">
    <button>Change Profile</button>
    <button>Save</button>
</div>
    </form> <br>

    <a href="settings.html" class="back-link">Back to Settings</a>

<script type="text/javascript">
// ===== DOM Selectors =====
const profileImg = document.querySelector('img[alt="Profile Picture"]');
const changePicBtn = document.querySelectorAll('.button-group button')[0]; // first button
const saveBtns = document.querySelectorAll('.button-group button'); // all buttons
const usernameInput = document.getElementById('username');
const emailInput = document.getElementById('email');
const ageInput = document.getElementById('age');

// ===== Functions =====

// Load saved profile from localStorage
function loadProfile() {
    const profileData = JSON.parse(localStorage.getItem('profileData'));
    if(profileData) {
        usernameInput.value = profileData.username || '';
        emailInput.value = profileData.email || '';
        ageInput.value = profileData.age || '';
        profileImg.src = profileData.profilePic || profileImg.src;
    }
}

// Change profile picture
function changeProfilePic() {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.click();

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                profileImg.src = ev.target.result; // update the profile pic
            }
            reader.readAsDataURL(file);
        }
    });
}

// Save profile info
function saveProfile(e) {
    e.preventDefault(); // prevent form submission
    const profileData = {
        username: usernameInput.value,
        email: emailInput.value,
        age: ageInput.value,
        profilePic: profileImg.src
    };

    localStorage.setItem('profileData', JSON.stringify(profileData)); // save to localStorage
    console.log('Saved Profile:', profileData); // for testing
    alert('Profile saved successfully!');
}

// ===== Event Listeners =====
changePicBtn.addEventListener('click', changeProfilePic);

// Attach save functionality to both Save buttons
saveBtns.forEach(btn => {
    if(btn.textContent.toLowerCase() === 'save') {
        btn.addEventListener('click', saveProfile);
    }
});

// Optional: Hover effect for buttons
saveBtns.forEach(btn => {
    btn.addEventListener('mouseover', () => btn.style.backgroundColor = '#e0f7fa');
    btn.addEventListener('mouseout', () => btn.style.backgroundColor = '');
});
changePicBtn.addEventListener('mouseover', () => changePicBtn.style.backgroundColor = '#e0f7fa');
changePicBtn.addEventListener('mouseout', () => changePicBtn.style.backgroundColor = '');

// ===== Initialize page =====
window.addEventListener('load', loadProfile); // load saved profile on page load
</script>
